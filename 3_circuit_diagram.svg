<text x="40" y="846.875" font-size="17" text-anchor="start" font-weight="bold" fill="#000000" dominant-baseline="central"><tspan x="40" dy="0">Notes</tspan><tspan x="40" dy="21.25">- Every 3V3 symbol connects to the ESP32 3V3 pin; every ground symbol to common GND.</tspan><tspan x="40" dy="21.25">- MFRC522 is a 3.3 V device: never power it from 5 V.</tspan><tspan x="40" dy="21.25">- Buzzer on GPIO 27 directly; use a transistor driver if its current exceeds the GPIO limit.</tspan><tspan x="40" dy="21.25">- Button: GPIO 14 to GND with INPUT_PULLUP (reads LOW when pressed).</tspan><tspan x="40" dy="21.25">- Check the OLED and HX711 module supply ratings before powering.</tspan></text>
</svg>